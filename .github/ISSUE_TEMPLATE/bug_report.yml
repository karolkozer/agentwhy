name: Bug report
description: Something agentwhy did wrong, or did not do
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        agentwhy reads Claude Code transcripts, which can hold live secrets. **Do not paste a real transcript,
        a real secret, or a real path from your machine.** A short synthetic example is enough.

        A security problem does not belong here. Report it privately instead: see [SECURITY.md](https://github.com/karolkozer/agentwhy/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command, and a synthetic transcript or the fixture in `tests/fixtures/` that shows it.
      render: shell
  - type: input
    id: version
    attributes:
      label: agentwhy version
      description: Run `npm ls @agentwhy/cli`, or `npx @agentwhy/cli` and note the version on the npm page.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Run `node --version`.
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version and operating system
      description: For example "2.1.0, macOS 15". Run `claude --version`.
  - type: checkboxes
    id: clean
    attributes:
      label: Nothing private in this report
      options:
        - label: I removed secrets, real file paths and transcript content from everything above.
          required: true
