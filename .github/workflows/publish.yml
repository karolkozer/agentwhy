name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # Held by the `npm` environment: add required reviewers there so a release waits for a person.
    environment: npm

    # The only job that needs more than read access. `id-token` is what npm Trusted Publishing exchanges for a
    # short-lived publish credential; `contents` is for the GitHub Release.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Only a version tag that is part of main may publish. A manual run from a branch, or a tag pushed from an
      # unreviewed branch, stops here.
      - name: Verify release ref
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          git merge-base --is-ancestor HEAD origin/main

      # Trusted Publishing needs npm 11.5.1 or newer; say so here rather than in a failed publish.
      - name: Verify npm supports Trusted Publishing
        shell: bash
        run: |
          printf '%s\n' "11.5.1" "$(npm --version)" | sort -V -C

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check canary guardrail
        run: npm run check:canary

      - name: Check package contents
        run: npm run check:package

      - name: Publish package
        run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
